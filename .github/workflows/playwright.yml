name: Playwright Tests

on:
    push:
        branches:
            - main
    pull_request: 
        branches: 
            - main
    schedule:
        - cron: '30 18 * * *' # 12:00 AM IST

jobs:
    test:
        runs-on: ubuntu-latest

        env:
          TEST_ENV: qa
          BASE_URL: https://automationintesting.online/
          API_URL: https://automationintesting.online
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6
          
          - name: Setup Node.js
            uses: actions/setup-node@v6
            with: 
              node-version: 24
              cache: npm
          
          - name: Install dependencies
            run: npm ci
          
          - name: Install Playwright Browsers
            run: npx playwright install --with-deps

          - name: check for required environment variables 
            run: | 
              test -n "$BASE_URL" || { echo "BASE_URL is not set"; exit 1; } 
              test -n "$API_URL" || { echo "API_URL is not set"; exit 1; }
              if [ -z "$ADMIN_USERNAME" ] || [ -z "$ADMIN_PASSWORD" ]; then
                echo "ADMIN_USERNAME or ADMIN_PASSWORD not set — skipping admin-only tests"
                exit 0
              fi
              echo "All required environment variables are set."
                
          - name: Run Playwright tests
            run: npm run test:qa

          - name: Upload Playwright Report
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: playwright-results
                path: playwright-html-report/

          - name: Generate Allure Report
            if: always() 
            run: npm run allure:generate

          - name: Upload Allure Report
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: allure-report
                path: allure-report/
                if-no-files-found: error

          - name: Upload Test Results
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: test-results
                path: test-results/
