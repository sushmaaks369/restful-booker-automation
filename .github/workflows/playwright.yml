name: Playwright Tests

on:
    push:
        branches:
            - main
    pull_request: 
        branches: 
            - main
    schedule:
        - cron: '0 0 * * *' # Runs every day at midnight

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            # non-secret values (repo Variables)
            BASE_URL: ${{ vars.baseURL }}
            API_URL: ${{ vars.apiURL }}
            # secrets (repo Secrets)
            ADMIN_USERNAME: ${{ secrets.adminUsername }}
            ADMIN_PASSWORD: ${{ secrets.adminPassword }}

        steps:
          - uses: actions/checkout@v6
          
          - name: Setup Node.js
            uses: actions/setup-node@v6
            with: 
              node-version: 24
              cache: npm
          
          - name: Verify env vars (safe)
            run: |
              # Non-secret: safe to show
              if [ -z "$baseURL" ]; then echo "BASE_URL is missing"; exit 1; else echo "BASE_URL=$baseURL"; fi
              if [ -z "$apiURL" ]; then echo "API_URL is missing"; exit 1; else echo "API_URL=$apiURL"; fi

              # Secrets: do NOT print their values; show presence/masked info instead
              if [ -z "$adminUsername" ]; then echo "ADMIN_USERNAME is missing"; exit 1; else echo "ADMIN_USERNAME present (length=${#adminUsername})"; fi
              if [ -z "$adminPassword" ]; then echo "ADMIN_PASSWORD is missing"; exit 1; else echo "ADMIN_PASSWORD present (length=${#adminPassword})"; fi

          - name: Install dependencies
            run: npm ci
          
          - name: Install Playwright Browsers
            run: npx playwright install --with-deps

          - name: Run Playwright tests
            run: npx playwright test
          
          - name: Upload Playwright Report
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: playwright-results
                path: playwright-html-report/

          - name: Generate Allure Report
            if: always() 
            run: npm run allure:generate

          - name: Upload Allure Report
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: allure-report
                path: allure-report/
                if-no-files-found: error

          - name: Upload Test Results
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: test-results
                path: test-results/
